@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1c221e;--tx:#ecefe9;--mu:#98a39b;--ac:#4fc99a;--acs:#21342b;--bd:#2c3530;--bad:#ff8a7d;--ok:#4fc99a}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
h1{font-size:20px;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.5}
textarea,input[type=text]{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
textarea{min-height:240px;resize:vertical}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:14px}
#view{white-space:pre-wrap;user-select:text;-webkit-user-select:text}
a.t{color:var(--ac);text-decoration:underline;cursor:pointer}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);background:var(--acs)}.opt.no{border-color:var(--bad)}
.flip{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;box-shadow:0 -8px 30px #0003;display:none}
#sheet h3{margin:0 0 6px}
#sel{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;box-shadow:0 4px 18px #0004}
.hide{display:none}.fig{margin:12px 0}.fig svg{width:100%;height:auto;max-width:620px;display:block;margin:0 auto}.fig text{fill:var(--tx)}
</style>

const SUM=`<h3>Chemische Bindung</h3><ul><li>Atome wollen den <b>Edelgaszustand</b> (voll besetzte Valenzschale, 8 Valenzelektronen). Edelgase sind deshalb als Einzelatome stabil.</li><li>In der Natur gibt es kaum einzelne Atome: Luft besteht hauptsächlich aus O₂ und N₂, die einzigen Einzelatome sind Argon. Edelgase haben keine einfach besetzten Elektronenwolken. Unvollständig gefüllte Valenzschalen sind „ungünstig“.</li><li><b>Chemische Bindung</b> = Möglichkeit, die Valenzschale voll zu füllen (bzw. einfach besetzte Elektronenwolken zu füllen) und so den Edelgaszustand zu erreichen; sie ist eine <b>Kraft, die Atome zusammenhält</b>.</li><li><b>Kovalente Bindung:</b> Nichtmetall + Nichtmetall, Atome teilen Elektronenpaare → Moleküle (z. B. Cl₂).</li><li><b>Ionenbindung:</b> Metall + Nichtmetall → Salze. Nichtmetallatome entreißen den Metallatomen Valenzelektronen (Metall-Kationen +, Nichtmetall-Anionen −).</li><li><b>Modelle:</b> Kovalente Bindung braucht das Orbital-/Elektronenwolken-Modell, Ionen- und Metallbindung genügt das Schalenmodell.</li><li><b>Metallbindung:</b> Metall + Metall (später).</li><li>Ab <b>ΔEN ≥ 1,5</b> spricht man von Ionenbindung (Übergang fließend). Beispiel Na/Cl: 3,16 − 0,93 = <b>2,23</b>.</li><li><b>Bindungsenergie:</b> H₂ in 2 H spalten = Energie aufwenden (↑); Bildung von H₂ = Energie wird frei (↓).</li></ul><h3>NaCl-Synthese</h3>${F1}${F2}<ul><li><b>2 Na + Cl₂ → 2 NaCl</b> (Ionen: 2 Na⁺ + 2 Cl⁻). Na gibt sein Valenzelektron ab (Na⁺, Neon-Konfiguration, 8 Außenelektronen). Cl nimmt es auf (Cl⁻, 8 Valenzelektronen).</li><li>Bohr-Modell: Na hat 11 e⁻ (2-8-1), Na⁺ 10 e⁻ (2-8); Cl hat 17 e⁻ (2-8-7), Cl⁻ 18 e⁻ (2-8-8). Lewis: Na· hat 1 Punkt, Cl hat 7 Punkte, Cl⁻ 8 Punkte in Klammer.</li><li>Beobachtung: Natrium schmilzt, in Chlorgas orangefarbenes Leuchten, weißer Rauch = NaCl.</li><li>Energien: +109 kJ (Na schmelzen/verdampfen), +121 kJ (Cl₂ spalten), +502 kJ (Na-Elektron entreißen), −363 kJ (Cl nimmt Elektron auf), <b>−780 kJ Gitterenergie</b>. Gesamt: −411 kJ (exotherm).</li><li>Treibende Kraft der Salzbildung ist die <b>Gitterenergie</b>, nicht die Elektronenübertragung.</li></ul><h3>Gitterenergie</h3><ul><li>Energie, die frei wird, wenn gasförmige Ionen zu einem Ionengitter zusammenlagern. (Muss aufgewendet werden, um ein Salz zu sublimieren.)</li><li>E_G ~ Q₁·Q₂ / r (Q = Ionenladung, r = Abstand der Atomkerne/Ionengröße).</li><li><b>Größer bei: 1. höherer Ionenladung, 2. kleineren Ionen.</b></li><li>Folge: Je größer die Gitterenergie, desto <b>höher Schmelz- und Siedepunkt</b>.</li></ul><ul><li>Herleitung: Energie = Kraft × Weg (E = F·s). Die elektrostatische Anziehung zwischen Ionen: F_el = Q₁·Q₂ / r². Die Ionen werden vollständig voneinander entfernt (s → ∞), daher E_G ~ F_el: je größer F_el, desto größer E_G.</li></ul><h3>Ionenladung und Ionengröße</h3>${F3}${F4}<ul><li>Hauptgruppe x: Metalle geben x Elektronen ab → <b>x+</b>; Nichtmetalle nehmen (8−x) auf → <b>(8−x)−</b>. (I: 1+, II: 2+, III: 3+, V: 3−, VI: 2−, VII: 1−.)</li><li>Nebengruppen: Oxidationszahlen im PSE; wichtig: Zn²⁺, Cu⁺, Cu²⁺, Fe²⁺, Fe³⁺, Ag⁺. Oxidationszahlen nur für Metalle!</li><li>Ausnahmen: Bor, Kohlenstoff und Silicium bilden keine Ionen (Hauptgruppe IV teilt Elektronen).</li><li><b>Positive Ionen kleiner als das Atom:</b> eine Hauptschale weniger und weniger Elektronen, die sich abstoßen.</li><li><b>Negative Ionen größer als das Atom:</b> gleich viele Schalen, aber mehr Elektronen stoßen sich stärker ab.</li><li>Schmelzpunkt-Reihenfolge: <b>Al₂O₃ (2000 °C) > MgO > CaO > LiF > LiCl > NaCl (800 °C)</b>. Erst Ladung vergleichen (Al³⁺/O²⁻ > Mg²⁺, Ca²⁺ > Li⁺, Na⁺), dann Größe (kleiner = höher: Mg²⁺ < Ca²⁺; F⁻ < Cl⁻; Li⁺ < Na⁺).</li></ul>${F5}<h3>Verhältnisformeln und Namen</h3><ul><li>Salze bestehen aus Ionen im Gitter (kein NaCl-Molekül!). Die Verhältnisformel gibt das Ionenverhältnis an; das Salz ist nach außen neutral.</li><li>Formel aufstellen: Ionen mit Ladung notieren → kgV der Ladungen → Anzahl der Ionen → Formel (kleinste Indices, Ladungen nicht schreiben). Beispiel: Al³⁺ + O²⁻ → <b>Al₂O₃</b> (2·3 = 3·2).</li><li>Name: erst das positive Ion (Metall), dann das Nichtmetall-Ion mit Endung <b>-id</b>: Fluorid, Chlorid, Bromid, Iodid, Oxid, Sulfid, Selenid, Nitrid, Phosphid, Arsenid.</li><li>Mehrere Oxidationsstufen: Zahl in Klammern, z. B. Eisen(III)oxid = <b>Fe₂O₃</b>, Eisen(II)oxid = FeO, Kupfer(I)oxid = Cu₂O, Kupfer(II)oxid = CuO.</li><li>Beispiele: CaF₂ Calciumfluorid, Na₂O, MgCl₂, K₂S, AlCl₃, Li₃N, ZnO, Mg₃N₂, AlBr₃.</li><li><b>Salz oder Molekül?</b> Metall + Nichtmetall (ohne H) = Salz (Ionen angeben). Nur Nichtmetalle = Molekül (Lewisformel). K₂O, MgS, BaCl₂, Fe₂O₃ sind Salze; HF, CHCl₃, H₂O sind Moleküle.</li></ul><h3>Molekülionen (auswendig lernen!)</h3><ul><li>Aus Säuren (H⁺-Spender) entstehen Anionen durch Abgabe von H⁺ (H⁺ = Proton). Basen sind H⁺-Empfänger.</li><li><b>Kohlensäure H₂CO₃:</b> Hydrogencarbonat <b>HCO₃⁻</b>, Carbonat <b>CO₃²⁻</b></li><li><b>Salpetersäure HNO₃:</b> Nitrat <b>NO₃⁻</b></li><li><b>Schwefelsäure H₂SO₄:</b> Hydrogensulfat <b>HSO₄⁻</b>, Sulfat <b>SO₄²⁻</b></li><li><b>Phosphorsäure H₃PO₄:</b> Dihydrogenphosphat <b>H₂PO₄⁻</b>, Hydrogenphosphat <b>HPO₄²⁻</b>, Phosphat <b>PO₄³⁻</b></li><li>Cyanid <b>CN⁻</b> (aus HCN), Hydroxid <b>OH⁻</b> (aus H₂O, kleinstes Teilchen der Laugen), Silikat SiO₄⁴⁻</li><li>Kation: Ammonium <b>NH₄⁺</b> (NH₃ + H⁺)</li><li><b>Molekülionen kann man nicht zerlegen</b>, sie sind die kleinsten Teilchen (CO₃²⁻ ≠ C⁴⁺ + 3 O²⁻). Mehrere davon in Klammern: Ca(NO₃)₂, (NH₄)₂SO₄, Al₂(SO₄)₃.</li><li>Beispiele: NH₄Cl, K₂CO₃, Ca(NO₃)₂, Na₂HPO₄, Fe₃(PO₄)₂, AlPO₄.</li></ul><h3>Redox-Reaktionen</h3><ul><li>Redox = Reduktion + Oxidation, laufen immer gemeinsam ab (Elektronenübertragung).</li><li>Klassisch: Oxidation = Reaktion mit Sauerstoff (C → CO₂, H₂ → H₂O, Eisen → Rost). Heute allgemeiner: bei der NaCl-Bildung wird Natrium oxidiert.</li><li><b>Oxidation = Elektronenabgabe</b>, <b>Reduktion = Elektronenaufnahme</b> (Ladung wird kleiner).</li><li>Halbreaktionen: Oxidation Na → Na⁺ + e⁻ (×2); Reduktion Cl₂ + 2 e⁻ → 2 Cl⁻. Ionengleichung (ohne e⁻): 2 Na + Cl₂ → 2 Na⁺ + 2 Cl⁻. Stoffgleichung: 2 Na + Cl₂ → 2 NaCl (kleinstmögliche Indices).</li><li><b>Reduktionsmittel:</b> Elektronenspender, wird selbst oxidiert (Na, Metalle: kleine EN). <b>Oxidationsmittel:</b> Elektronenempfänger, wird selbst reduziert (Cl₂, Nichtmetalle: große EN).</li></ul><h3>Eigenschaften von Salzen</h3>${F7}<ul><li><b>Hohe Schmelz- und Siedepunkte:</b> Ionen ziehen sich stark an, viel Energie nötig, um das Gitter zu zerreißen (Eis 0 °C, NaCl 800 °C).</li><li><b>Spröde:</b> Beim Schlag verschieben sich Ionenschichten, gleiche Ladungen liegen nebeneinander, stoßen sich ab, Kristall zerspringt.</li><li><b>Fest leiten sie den Strom nicht</b> (Ionen auf Gitterplätzen fixiert), <b>als Schmelze und Lösung schon</b> (frei bewegliche Ionen). Strom = gerichtete Bewegung von Ladungsträgern (bei Metallen Elektronen, bei Salzen Ionen).</li><li><b>Löslich in Wasser</b> (viele Salze), Lösung leitet.</li></ul><h3>Lösen von Salzen</h3>${F6}<ul><li>Wassermolekül ist ein <b>Dipol</b>: EN(O) = 3,44 > EN(H) = 2,10, also O δ⁻, H δ⁺.</li><li>Wassermoleküle nähern sich mit ihren Partialladungen den Ionen. Beim Näherkommen geladener Teilchen wird Energie frei, diese reißt die Ionen aus dem Gitter.</li><li><b>Hydratation:</b> Ionen von Wassermolekülen umgeben (Hydrathülle); frei werdende Energie = <b>Hydratationsenergie</b>. Na⁺(aq), Cl⁻(aq).</li><li>Lösen = Gitter zerstören (Gitterenergie aufwenden) + Ionen hydratisieren (Hydratationsenergie wird frei).</li><li>Reaktionsgleichung: NaCl(f) → Na⁺(aq) + Cl⁻(aq) (H₂O über dem Pfeil). Ein Ion ist eigentlich von etwa 6 H₂O umgeben (nicht nur 4 wie gezeichnet).</li><li>Schmelzen: Energie muss zugeführt werden. Lösen: nicht, Energie kommt aus der Hydratation.</li></ul><h3>Schwerlösliche Salze</h3><ul><li>Hohe Gitterenergie → Wasser kann das Gitter kaum auflösen. Beispiele: Kalk CaCO₃, Gips CaSO₄·2 H₂O (Kristallwasser), Ca₃(PO₄)₂ (Knochen), Fe₂O₃ (Rost), Al₂O₃ (Bauxit), Olivin FeMgSiO₄.</li><li><b>Je stärker geladen und je kleiner die Ionen, desto schwerlöslicher.</b> Al³⁺ (eine Hauptschale weniger als Fe³⁺) bildet schwerlöslichere Salze als Fe³⁺. SO₄²⁻ größer als CO₃²⁻ (vier O statt drei). Steigende Schwerlöslichkeit: SO₄²⁻, CO₃²⁻, PO₄³⁻, O²⁻, SiO₄⁴⁻.</li><li>Kalk (CaCO₃) + Wasser ergibt nur eine Suspension: CaCO₃(f) → Ca²⁺(aq) + CO₃²⁻(aq) läuft praktisch nicht ab (Konzentrationen ca. 10⁻¹⁰ mol/L). In saurem Regen löst er sich nach einer Umwandlung: CaCO₃ + H₂CO₃ → Ca(HCO₃)₂.</li><li><b>Immer leichtlöslich:</b> Salze mit Li⁺, Na⁺, K⁺, NH₄⁺, NO₃⁻.</li></ul><h3>Fällungsreaktionen</h3>${F9}<ul><li>Ausfällen eines schwerlöslichen Salzes aus einer Lösung. Beispiel: AgNO₃ + NH₄Cl → <b>weißer Niederschlag AgCl</b> (NH₄NO₃ bleibt gelöst, leichtlöslich).</li><li>Ionengleichung: Ag⁺(aq) + NO₃⁻(aq) + NH₄⁺(aq) + Cl⁻(aq) → AgCl(f) + NH₄⁺(aq) + NO₃⁻(aq). Kurz: Ag⁺(aq) + Cl⁻(aq) → AgCl(f).</li><li>Vorgehen: Salze in Ionen zerlegen → neue Kombinationen bilden → Löslichkeitskriterien prüfen, welches schwerlöslich ist.</li></ul><h3>Hartes Wasser und Enthärter</h3>${F8}${F8b}<ul><li>Hartes Wasser enthält gelöste <b>Ca²⁺ und HCO₃⁻</b> (auch Mg²⁺). Entsteht, wenn saurer Regen Kalk löst: H₂O + CO₂ → H₂CO₃; CaCO₃ + H₂CO₃ → Ca²⁺(aq) + 2 HCO₃⁻(aq).</li><li>Problem 1: Ca²⁺ fällt Seifen-Anionen (RCOO⁻) zu schwerlöslicher <b>Kalkseife</b> Ca(RCOO)₂ → Waschwirkung sinkt, weiße Flecken auf der Wäsche. (Seife = KRCOO.)</li><li>Problem 2: Beim Erhitzen fällt <b>Kesselstein</b> (CaCO₃) aus: Ca²⁺ + 2 HCO₃⁻ → CaCO₃ + H₂CO₃. Behindert den Wasserfluss, wirkt als Isolator, Heizeffizienz sinkt, Gefahr der Überhitzung.</li><li><b>Wasser-Enthärter:</b> negativ geladenes Ionentauscher-Harz mit gebundenen Na⁺. Ca²⁺ und Mg²⁺ ersetzen die Na⁺-Ionen → weiches Wasser (enthält Na⁺).</li></ul>`;

["Wie löst sich Kalk in saurem Regen?","CaCO₃ + H₂CO₃ → Ca(HCO₃)₂",["CaCO₃ → Ca + CO₃","CaCO₃ + NaCl → CaCl₂","Gar nicht"],"Es entsteht lösliches Calciumhydrogencarbonat."],
["Was ist Gips?","CaSO₄ · 2 H₂O (mit Kristallwasser)",["CaCO₃","Ca₃(PO₄)₂","Fe₂O₃"],"H₂O-Moleküle nehmen bestimmte Plätze im Gitter ein."],
["Welche Salze sind Beispiele für schwerlösliche Salze?","Ca₃(PO₄)₂ (Knochen), Fe₂O₃ (Rost), Al₂O₃ (Bauxit), Olivin",["NaCl, KNO₃","NH₄Cl, NaNO₃","LiNO₃, KCl"],"Alle haben hohe Gitterenergie."],
["Welches Ion ist in Olivin FeMgSiO₄ enthalten?","Das Silikat-Ion SiO₄⁴⁻",["Das Sulfat-Ion","Das Nitrat-Ion","Das Carbonat-Ion"],"Aus Kieselsäure durch H⁺-Abgabe."],
["Was ist eine Fällungsreaktion?","Ausfallen eines schwerlöslichen Salzes aus einer Lösung",["Auflösen eines Salzes","Schmelzen eines Salzes","Elektronenübertragung zwischen Metallen"],"Ionen binden stark aneinander und bilden ein festes Salz."],
["Was beobachtet man beim Zutropfen von AgNO₃ zu NH₄Cl-Lösung?","Weißer Niederschlag (AgCl)",["Gasentwicklung","Blaue Lösung","Keine Reaktion"],"Präzipitat."],
["Welche zwei Salze kann man aus Ag⁺, NO₃⁻, NH₄⁺, Cl⁻ bilden?","AgCl und NH₄NO₃",["AgNH₄ und NO₃Cl","Ag₂Cl und NH₄NO₂","AgNO₃ und NH₄Cl"],"Die beiden Ausgangsstoffe sind AgNO₃ und NH₄Cl."],

["Wie lautet die Formel von Silbernitrat?","AgNO₃",["AgNO₂","Ag₂NO₃","Ag(NO₃)₂"],"Ag⁺ + NO₃⁻."],

["Wie ist Flüssigseife aufgebaut?","K⁺-Ionen und Seifen-Anionen RCOO⁻",["Neutrale Moleküle","Ca²⁺ und OH⁻","Na⁺ und Cl⁻"],"Vereinfacht KRCOO, R = CH₃(CH₂)₁₆."],

const BANK=RAW.map(([q,r,w,why],i)=>{const o=[...w];o.splice(i%4,0,r);return{q,options:o,correct:i%4,why}});
S.seeded=S.seeded||[];
S.subs.forEach(s=>{if(SEED[s.name]&&!s.text&&!S.seeded.includes(s.name)){s.text=SEED[s.name];S.seeded.push(s.name)}});
if(S.qv!==4){sub0().quiz=shuf(BANK);S.qv=4;try{localStorage.setItem("lernapp_chemie",JSON.stringify(S))}catch(e){}}
try{localStorage.setItem("lernapp_chemie",JSON.stringify(S))}catch(e){}
let cur=0,tab="sum",sample=null,busy=false,ci=0,flipped=false,qi=0,score=0,picked=null,wrong=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("lernapp_chemie",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(typeof claude!=="undefined")claude.use("sample").then(s=>{sample=s;render()}).catch(()=>{});
const sub=()=>S.subs[cur];

async function ask(prompt,json){
  if(!sample)throw {message:"Claude ist hier nicht verfügbar."};
  return json?await sample.json(prompt):(await sample(prompt)).text;
}
const ctx=()=>`Fach: ${sub().name}. Zielgruppe: 18-jähriger Schüler in Österreich (Oberstufe).`;

function render(){
  $("subj").innerHTML=S.subs.map((s,i)=>`<button class="${i==cur?'on':''}" data-s="${i}">${esc(s.name)}</button>`).join("")+`<button data-ren="1" title="Umbenennen">✏️</button>`;
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" data-t="${k}">${l}</button>`).join("");
  const p=$("pane"),s=sub();
  if(tab=="sum"){
    p.innerHTML=`<div class="mu">Basics für den IESTest CH 2. Markiere etwas und tippe „Erklären“.</div><div class="card" id="view" style="white-space:normal">${SUM}</div>`;
  }else if(tab=="mat"){
    p.innerHTML=`<div class="card"><div class="mu">Text deiner Datei hier einfügen (aus Word/PDF kopieren) oder .txt/.md laden.</div>
    <textarea id="ta" placeholder="Material für ${esc(s.name)}…">${esc(s.text)}</textarea>
    <div class="row" style="margin-top:8px"><label class="btn">📄 Datei laden<input type="file" id="fi" accept=".txt,.md,.csv,text/*" class="hide"></label>
    <button id="read">📖 Lesen &amp; Wörter erklären</button></div></div>
    <div id="rd"></div>`;
    $("ta").oninput=e=>{s.text=e.target.value;save()};
    $("fi").onchange=async e=>{const f=e.target.files[0];if(f){s.text=await f.text();save();render()}};
    $("read").onclick=()=>{tab="read";render()};
  }else if(tab=="read"){
    p.innerHTML=`<div class="mu">Markiere ein Wort oder einen Satz, dann tippe „Erklären“.</div><div class="card" id="view">${esc(s.text)||"Noch kein Material."}</div><button data-t="mat">← Zurück</button>`;
  }else if(tab=="cards"){
    const c=s.cards;
    p.innerHTML=`<div class="row"><button class="pri" id="gen" ${busy?'disabled':''}>${busy?'Erstelle…':'✨ Karten aus Material erstellen'}</button></div>`+
    (c.length?`<div class="card flip" id="fl">${esc(flipped?c[ci].a:c[ci].q)}</div>
    <div class="row"><button id="pv">←</button><span class="mu">${ci+1}/${c.length} · Tippen zum Umdrehen</span><button id="nx">→</button></div>`:`<p class="mu">Noch keine Karten.</p>`);
    $("gen").onclick=()=>gen("cards");
    if(c.length){$("fl").onclick=()=>{flipped=!flipped;render()};$("pv").onclick=()=>{ci=(ci+c.length-1)%c.length;flipped=false;render()};$("nx").onclick=()=>{ci=(ci+1)%c.length;flipped=false;render()}}
  }else if(tab=="quiz"){
    const q=s.quiz;
    let h=`<div class="row"><button class="pri" id="gen" ${busy?'disabled':''}>${busy?'Erstelle…':'✨ Quiz aus Material erstellen'}</button></div>`;
    if(q.length){
      if(qi>=q.length)h+=`<div class="card"><b>Fertig: ${score}/${q.length} richtig</b><div class="row" style="margin-top:8px"><button id="rs">Nochmal</button>${wrong.length?`<button id="rw">❌ Falsche wiederholen (${wrong.length})</button>`:""}</div></div>`;
      else{const x=q[qi];h+=`<div class="card"><div class="mu">Frage ${qi+1}/${q.length}</div><p><b>${esc(x.q)}</b></p>`+
        x.options.map((o,i)=>`<button class="opt ${picked!=null?(i==x.correct?'ok':i==picked?'no':''):''}" data-o="${i}" ${picked!=null?'disabled':''}>${esc(o)}</button>`).join("")+
        (picked!=null?`<p class="mu">${esc(x.why||"")}</p><div class="row"><button class="pri" id="nq">Weiter</button><button data-ex="${esc(x.q)}">💡 Erklären</button></div>`:"")+`</div>`}
    }else h+=`<p class="mu">Noch kein Quiz.</p>`;
    p.innerHTML=h;const bb=document.createElement("button");bb.textContent="🔀 Prüfungsfragen (gemischt)";bb.onclick=()=>{sub().quiz=shuf(BANK);wrong=[];qi=0;score=0;picked=null;save();render()};p.firstChild.appendChild(bb);$("gen").onclick=()=>gen("quiz");
    if($("rs"))$("rs").onclick=()=>{wrong=[];qi=0;score=0;picked=null;render()};
    if($("rw"))$("rw").onclick=()=>{sub().quiz=shuf(wrong);wrong=[];qi=0;score=0;picked=null;render()};
    if($("nq"))$("nq").onclick=()=>{qi++;picked=null;render()};
  }else if(tab=="wiki"){
    const keys=Object.keys(S.wiki).sort();
    p.innerHTML=`<div class="row" style="flex-wrap:nowrap"><input type="text" id="wq" placeholder="Begriff suchen, z. B. Ionenbindung"><button class="pri" id="wg">Suchen</button></div>
    <div class="card mu">Erklärungen kommen von Claude (kein echtes Wikipedia). Verlinkte Begriffe kannst du antippen.</div>
    <div class="row">${keys.map(k=>`<button data-w="${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
    const go=()=>{const v=$("wq").value.trim();if(v)explain(v)};
    $("wg").onclick=go;$("wq").onkeydown=e=>{if(e.key=="Enter")go()};
  }
}

async function gen(kind){
  const s=sub();
  if(!s.text.trim()){alert("Füge zuerst Material ein.");return}
  busy=true;render();
  try{
    const src=s.text.slice(0,14000);
    if(kind=="cards"){
      s.cards=await ask(`${ctx()}\nErstelle 15 Lernkarten auf Deutsch aus diesem Material. Antworte NUR mit JSON: [{"q":"Frage","a":"kurze Antwort"}].\n\nMaterial:\n${src}`,true);ci=0;flipped=false;
    }else{
      s.quiz=await ask(`${ctx()}\nErstelle 10 Multiple-Choice-Fragen auf Deutsch (schularbeitsnah) aus diesem Material. Antworte NUR mit JSON: [{"q":"","options":["","","",""],"correct":0,"why":"kurze Begründung"}] (correct = Index).\n\nMaterial:\n${src}`,true);qi=0;score=0;picked=null;
    }
    save();
  }catch(e){alert(e.message||"Fehler")}
  busy=false;render();
}

async function explain(term,context){
  const sh=$("sheet");sh.style.display="block";
  sh.innerHTML=`<h3>${esc(term)}</h3><p class="mu">Claude erklärt…</p>`;
  try{
    const key=term.toLowerCase();
    let t=S.wiki[term]||S.wiki[key];
    if(!t){
      t=await ask(`${ctx()}\nErkläre „${term}“ wie ein kurzer Lexikoneintrag: einfach, präzise, max. 130 Wörter, Deutsch, mit einem Beispiel. Setze 2–4 verwandte Fachbegriffe in doppelte eckige Klammern, z. B. [[Elektron]]. Kein Markdown.${context?"\nKontext aus dem Material: "+context.slice(0,400):""}`);
      S.wiki[term]=t;save();
    }
    const body=esc(t).replace(/\[\[(.+?)\]\]/g,(m,a)=>`<a class="t" data-w="${a}">${a}</a>`);
    sh.innerHTML=`<div class="row" style="justify-content:space-between"><h3>${esc(term)}</h3><button id="cl">✕</button></div><div style="white-space:pre-wrap">${body}</div>`;
    $("cl").onclick=()=>sh.style.display="none";
  }catch(e){sh.innerHTML=`<p>${esc(e.message||"Fehler")}</p><button id="cl">✕</button>`;$("cl").onclick=()=>sh.style.display="none"}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-s],[data-t],[data-w],[data-o],[data-ren],[data-ex]");
  if(!t)return;const d=t.dataset;
  if(d.s!=null){cur=+d.s;ci=0;qi=0;score=0;picked=null;render()}
  else if(d.t){tab=d.t;render()}
  else if(d.w){explain(d.w)}
  else if(d.ex){explain(d.ex)}
  else if(d.ren){const n=prompt("Neuer Name für das Fach:",sub().name);if(n){sub().name=n;save();render()}}
  else if(d.o!=null){picked=+d.o;if(picked==sub().quiz[qi].correct)score++;else wrong.push(sub().quiz[qi]);render()}
});

let selTxt="";
document.addEventListener("selectionchange",()=>{
  const v=$("view"),sel=getSelection(),b=$("sel");
  const x=sel&&sel.toString().trim();
  if(v&&x&&x.length<300&&v.contains(sel.anchorNode)){selTxt=x;b.style.display="block"}else b.style.display="none";
});
$("sel").onclick=()=>{$("sel").style.display="none";explain(selTxt,sub().text)};
$("sel").addEventListener("mousedown",e=>e.preventDefault());
render();
</script>
</body>
